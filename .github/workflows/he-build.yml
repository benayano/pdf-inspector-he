# pdf-inspector-he CI: Rust tests, the JS check layer, and the WebAssembly
# packages for the browser (`web`) and for Deno / Supabase Edge Functions
# (`deno`). A tag `he-v*` attaches both packages to a GitHub Release.
name: he build

on:
  push:
    branches: [main, hebrew-support]
    tags: ['he-v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTUP_TOOLCHAIN: "1.98.0"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings
      - run: cargo test --release
      - run: cargo build --release --bin pdf2md
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Invoice regression corpus
        run: node he/regression.mjs
      - name: JS check layer
        run: node --test he/*.test.mjs

  wasm:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: wasm -> target
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build (browser)
        run: wasm-pack build wasm --target web --out-dir pkg-web --out-name pdf_inspector --release
      - name: Build (Deno / Supabase)
        run: wasm-pack build wasm --target deno --out-dir pkg-deno --out-name pdf_inspector --release
      - name: Copy the JS check layer into both packages
        run: |
          cp he/rtl-check.mjs he/rtl-check.d.ts wasm/pkg-web/
          cp he/rtl-check.mjs he/rtl-check.d.ts wasm/pkg-deno/
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Smoke test on Deno (the Edge Function runtime)
        run: deno run --allow-read he/deno-smoke.ts wasm/pkg-deno tests/fixtures/rtl_hebrew_glyph_by_glyph.pdf
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-inspector-he-wasm-web
          path: wasm/pkg-web
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-inspector-he-wasm-deno
          path: wasm/pkg-deno
      - name: Release
        if: startsWith(github.ref, 'refs/tags/he-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd wasm/pkg-web && zip -r ../../pdf-inspector-he-wasm-web.zip .)
          (cd wasm/pkg-deno && zip -r ../../pdf-inspector-he-wasm-deno.zip .)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes \
            pdf-inspector-he-wasm-web.zip pdf-inspector-he-wasm-deno.zip
