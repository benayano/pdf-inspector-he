name: pdf_inspector_he
description: >-
  Hebrew / RTL invoices from PDF on the device, through dart:ffi: the item
  table, header, totals, arithmetic checks and a compact repair request,
  as one JSON document (invoice-document@1).
version: 1.25.2
publish_to: none

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
